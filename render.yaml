services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    healthCheckPath: /v1/healthz
    autoDeploy: false

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONHASHSEED
        value: "0"

      # Gemini LLM wording layer
      - key: LLM_PROVIDER
        value: "gemini"

      - key: LLM_MODEL
        value: "gemini-3.5-flash"

      - key: LLM_TIMEOUT_SECONDS
        value: "6"

      - key: LLM_FORCE_IPV4
        value: "1"

      - key: BOT_CONTACT_EMAIL
        sync: false

      - key: LLM_API_KEY
        sync: false