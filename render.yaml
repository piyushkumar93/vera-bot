services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    healthCheckPath: /v1/healthz
    autoDeploy: false

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONHASHSEED
        value: "0"

      - key: LLM_PROVIDER
        value: "nvidia"

      - key: NIM_BASE_URL
        value: "https://integrate.api.nvidia.com/v1"

      - key: LLM_MODEL
        value: "nvidia/nemotron-3-super-120b-a12b"

      - key: LLM_FALLBACK_MODEL
        value: "nvidia/nemotron-3-super-120b-a12b"

      - key: LLM_TIMEOUT_SECONDS
        value: "20"

      - key: LLM_FORCE_IPV4
        value: "1"

      - key: BOT_MODEL
        value: "nvidia/nemotron-3-super-120b-a12b"

      - key: NVIDIA_API_KEY
        sync: false

      - key: BOT_CONTACT_EMAIL
        sync: false