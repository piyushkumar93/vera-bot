services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    healthCheckPath: /v1/healthz
    autoDeploy: false

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONHASHSEED
        value: "0"

      # Production is deliberately deterministic. This is the measured winner:
      # the wording layer is wired in and can be switched on, but no provider
      # key is configured here, so composition never leaves the process.
      #
      # To turn on the optional LLM wording layer, set LLM_PROVIDER to
      # "gemini" or "nvidia" and add the matching key env var. Selection,
      # consent, suppression, facts, and CTA stay deterministic either way, and
      # any provider failure falls back to the deterministic body.
      - key: LLM_PROVIDER
        value: ""

      - key: LLM_TIMEOUT_SECONDS
        value: "6"

      - key: LLM_FORCE_IPV4
        value: "1"

      - key: BOT_CONTACT_EMAIL
        sync: false